name: Canonical image extract check

on:
  push:
    branches: [canonical-image-finalize]
    paths:
      - '.github/workflows/canonical-image-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract embedded canonical WebP assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical-extracted
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'training/assets/canonical-v1';
          const assets = new Map();
          const aggregate = ['canonical-images.js','catalog-1.js'];
          for (const fn of aggregate) {
            const file=path.join(dir,fn); if(!fs.existsSync(file)) continue;
            const s=fs.readFileSync(file,'utf8');
            const re=/["']([a-z0-9-]+)["']\s*:\s*["']data:image\/webp;base64,([^"']+)["']/g;
            let m; while((m=re.exec(s))!==null) assets.set(m[1],m[2]);
          }
          for (const fn of fs.readdirSync(dir).filter(x=>x.endsWith('.js')&&!aggregate.includes(x))) {
            const file=path.join(dir,fn), s=fs.readFileSync(file,'utf8');
            const m=s.match(/data:image\/webp;base64,([^"']+)/);
            if(m) assets.set(path.basename(fn,'.js'),m[1]);
            console.log(`${fn}: ${s.length} chars, data=${!!m}`);
          }
          for (const [name,b64] of assets) fs.writeFileSync(path.join('canonical-extracted',`${name}.webp`),Buffer.from(b64,'base64'));
          console.log(`Extracted ${assets.size} assets:`); console.log([...assets.keys()].sort().join('\n'));
          NODE
          file canonical-extracted/*.webp
          sha256sum canonical-extracted/*.webp | sort
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-extracted
          path: canonical-extracted/*.webp
          if-no-files-found: error
