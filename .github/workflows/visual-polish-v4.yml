name: Visual polish v4 patch

on:
  push:
    branches: [visual-polish-v4]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-polish-v4
          fetch-depth: 0
      - name: Apply visual polish patch
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('training/index.html')
          s=p.read_text()
          s=s.replace('.logo{display:block;width:100%;height:auto;max-height:122px;object-fit:contain;object-position:right top}', '.logoMark{display:block;width:100%;aspect-ratio:600/298;background:#2f8f83;-webkit-mask:url("assets/working-motion-logo.svg?v=visual-polish-v4") center/contain no-repeat;mask:url("assets/working-motion-logo.svg?v=visual-polish-v4") center/contain no-repeat}')
          s=s.replace('.icon{width:58px;height:58px;display:block}', '.icon{width:58px;height:58px;display:block;object-fit:contain}')
          s=s.replace('  .logo{max-height:76px}\n','')
          s=s.replace('<div class="logoWrap"><img class="logo" src="assets/working-motion-logo.svg?v=visual-polish-v3" alt="Working Motion"></div>', '<div class="logoWrap"><span class="logoMark" role="img" aria-label="Working Motion"></span></div>')
          replacements=[
            '<img class="icon" src="assets/rules/calendar.svg?v=visual-polish-v4" alt="" aria-hidden="true">',
            '<img class="icon" src="assets/rules/barbell.svg?v=visual-polish-v4" alt="" aria-hidden="true">',
            '<img class="icon" src="assets/rules/heart.svg?v=visual-polish-v4" alt="" aria-hidden="true">'
          ]
          for rep in replacements:
            s,n=re.subn(r'<svg class="icon" viewBox="0 0 64 64" aria-hidden="true">.*?</svg>',rep,s,count=1,flags=re.S)
            assert n==1
          start=s.index('function drawCalendarIcon(')
          end=s.index('async function poster(){')
          s=s[:start]+s[end:]
          tint='''function drawTintedContained(ctx,img,x,y,w,h,color){\n  const s=Math.min(w/img.naturalWidth,h/img.naturalHeight);\n  const dw=Math.max(1,Math.round(img.naturalWidth*s)),dh=Math.max(1,Math.round(img.naturalHeight*s));\n  const off=document.createElement('canvas');off.width=dw;off.height=dh;\n  const ox=off.getContext('2d');ox.drawImage(img,0,0,dw,dh);ox.globalCompositeOperation='source-in';ox.fillStyle=color;ox.fillRect(0,0,dw,dh);\n  ctx.drawImage(off,x+(w-dw)/2,y+(h-dh)/2,dw,dh);\n}\n'''
          s=s.replace('function drawNumber(ctx,n,x,y,color){',tint+'function drawNumber(ctx,n,x,y,color){')
          s=s.replace("const logo=await loadImage('assets/working-motion-logo.svg');\n  const images=await Promise.all(exercises.map(e=>loadImage(e[1])));", "const [logo,calendarIcon,exerciseIcon,barbellIcon,heartIcon]=await Promise.all([\n    loadImage('assets/working-motion-logo.svg'),\n    loadImage('assets/rules/calendar.svg'),\n    loadImage('assets/rules/exercises.svg'),\n    loadImage('assets/rules/barbell.svg'),\n    loadImage('assets/rules/heart.svg')\n  ]);\n  const images=await Promise.all(exercises.map(e=>loadImage(e[1])));")
          s=s.replace("drawContained(x,logo,W-335,28,280,115);","drawTintedContained(x,logo,W-335,28,280,115,'#2f8f83');")
          s=s.replace("drawNumber(x,1,M+64,y+43,'#18794e');drawCalendarIcon(x,M+64,y+106,58,'#18794e');","drawNumber(x,1,M+64,y+43,'#18794e');drawContained(x,calendarIcon,M+34,y+75,60,60);")
          s=s.replace("drawNumber(x,2,M+64,y+43,'#246dad');drawExerciseIcon(x,M+64,y+118,66,'#246dad');","drawNumber(x,2,M+64,y+43,'#246dad');drawContained(x,exerciseIcon,M+28,y+82,72,72);")
          s=s.replace("drawNumber(x,3,M+64,y+43,'#d89400');drawBarbellIcon(x,M+64,y+128,70,'#3b4148');","drawNumber(x,3,M+64,y+43,'#d89400');drawContained(x,barbellIcon,M+28,y+92,72,72);")
          s=s.replace("drawNumber(x,4,M+64,y+43,'#c4272c');drawHeartIcon(x,M+64,y+132,70,'#c4272c');","drawNumber(x,4,M+64,y+43,'#c4272c');drawContained(x,heartIcon,M+28,y+92,72,72);")
          s=s.replace("const CACHE='?v=visual-polish-v3-20260904';","const CACHE='?v=visual-polish-v4-20260904';")
          s=s.replace('cb=visual-polish-v3-20260904','cb=visual-polish-v4-20260904')
          assert 'drawCalendarIcon' not in s and 'visual-polish-v3' not in s
          p.write_text(s)
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('training/index.html').read_text()
          Path('/tmp/training-v4.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/training-v4.js
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add training/index.html
          git rm .github/workflows/visual-polish-v4.yml
          git commit -m "Polish training logo color and rule icons"
          git push origin HEAD:visual-polish-v4
