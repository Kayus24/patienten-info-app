<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1365" viewBox="0 0 1024 1365">
<style>
.t{font-family:Arial,sans-serif;fill:#102b50}
.h{font-weight:800}
.body{font-family:Arial,sans-serif;fill:#111;font-size:24px}
.l{font-size:52px}.m{font-size:34px}.xl{font-size:70px}
.green{fill:#2f7a4e}.blue{fill:#2870ad}.orange{fill:#df670e}.red{fill:#b92828}
</style>
<rect width="1024" height="1365" fill="#fff"/>
<text x="70" y="92" class="t h xl">TRAININGSREGELN</text>
<text x="74" y="142" class="t h m">FÜR IHR KRAFTTRAINING ZU HAUSE</text>
<rect x="45" y="175" width="934" height="220" rx="24" fill="#fbfdfb" stroke="#2f7a4e" stroke-width="2"/>
<circle cx="95" cy="225" r="35" fill="#2f7a4e"/><text x="84" y="239" font-family="Arial" font-size="38" font-weight="700" fill="#fff">1</text>
<text x="320" y="250" class="green h l">HÄUFIGKEIT</text>
<text x="320" y="318" class="body">2× pro Woche trainieren</text>
<g transform="translate(105 260)" fill="none" stroke="#2f7a4e" stroke-width="9"><rect x="0" y="0" width="110" height="95" rx="12"/><line x1="0" y1="25" x2="110" y2="25"/><line x1="25" y1="-10" x2="25" y2="15"/><line x1="85" y1="-10" x2="85" y2="15"/><circle cx="90" cy="80" r="24" fill="#2f7a4e" stroke="none"/><path d="M78 80l8 8 16-18" stroke="#fff" stroke-width="7"/></g>
<rect x="45" y="412" width="934" height="280" rx="24" fill="#fcfdff" stroke="#2870ad" stroke-width="2"/>
<circle cx="95" cy="462" r="35" fill="#2870ad"/><text x="84" y="476" font-family="Arial" font-size="38" font-weight="700" fill="#fff">2</text>
<text x="320" y="486" class="blue h l">UMFANG</text>
<circle cx="330" cy="535" r="6" fill="#2870ad"/><text x="352" y="545" class="body">Jede Übung: 3 Sätze</text>
<circle cx="330" cy="583" r="6" fill="#2870ad"/><text x="352" y="593" class="body">6–12 Wiederholungen pro Satz</text>
<circle cx="330" cy="631" r="6" fill="#2870ad"/><text x="352" y="641" class="body">Wenn Sie 12 Wiederholungen schaffen,</text><text x="352" y="671" class="body">Gewicht erhöhen</text>
<g transform="translate(95 535)" stroke="#2870ad" stroke-width="11"><line x1="0" y1="35" x2="115" y2="35"/><line x1="10" y1="10" x2="10" y2="60"/><line x1="26" y1="0" x2="26" y2="70"/><line x1="89" y1="0" x2="89" y2="70"/><line x1="105" y1="10" x2="105" y2="60"/></g>
<rect x="45" y="710" width="934" height="390" rx="24" fill="#fffdf9" stroke="#df670e" stroke-width="2"/>
<circle cx="95" cy="760" r="35" fill="#df670e"/><text x="84" y="774" font-family="Arial" font-size="38" font-weight="700" fill="#fff">3</text>
<text x="320" y="784" class="orange h l">SCHMERZREGEL</text>
<g transform="translate(325 835)"><line x1="0" y1="0" x2="610" y2="0" stroke="#8b9299" stroke-width="5"/><line x1="0" y1="0" x2="305" y2="0" stroke="#2f7a4e" stroke-width="7"/><circle cx="305" cy="0" r="12" fill="#df670e"/><g font-family="Arial" font-size="21" font-weight="700"><text x="-5" y="-22">0</text><text x="56" y="-22">1</text><text x="117" y="-22">2</text><text x="178" y="-22">3</text><text x="239" y="-22">4</text><text x="300" y="-22">5</text><text x="361" y="-22">6</text><text x="422" y="-22">7</text><text x="483" y="-22">8</text><text x="544" y="-22">9</text><text x="594" y="-22">10</text></g></g>
<circle cx="330" cy="892" r="6" fill="#df670e"/><text x="352" y="902" class="body">Während des Trainings sind Schmerzen bis 5/10 erlaubt.</text>
<circle cx="330" cy="940" r="6" fill="#df670e"/><text x="352" y="950" class="body">Am Abend und am nächsten Tag sollten die Schmerzen</text><text x="352" y="980" class="body">nicht stärker sein.</text>
<circle cx="330" cy="1018" r="6" fill="#df670e"/><text x="352" y="1028" class="body">Wenn die Schmerzen am Abend oder am nächsten Tag</text><text x="352" y="1058" class="body">stärker sind: nächstes Mal mit weniger Schmerz trainieren,</text><text x="352" y="1088" class="body">zum Beispiel nur bis 4/10 oder 3/10.</text>
<rect x="45" y="1118" width="934" height="200" rx="24" fill="#fffafa" stroke="#b92828" stroke-width="2"/>
<circle cx="95" cy="1168" r="35" fill="#b92828"/><text x="84" y="1182" font-family="Arial" font-size="38" font-weight="700" fill="#fff">4</text>
<text x="320" y="1192" class="red h l">WICHTIG</text>
<text x="320" y="1250" class="body">Schmerz bis 5/10 beim Training ist okay –</text><text x="320" y="1282" class="body">danach sollte es nicht mehr werden.</text>
</svg>