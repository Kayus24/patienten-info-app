<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1365" viewBox="0 0 1024 1365"><style>.t{font-family:Arial,sans-serif;fill:#102b50}.h{font-weight:800}.b{fill:#111}.s{font-size:28px}.m{font-size:34px}.l{font-size:52px}.xl{font-size:72px}.mut{fill:#56616d}.green{fill:#2f7a4e}.blue{fill:#2870ad}.orange{fill:#df670e}.red{fill:#b92828}.line{stroke:#d8dde3;stroke-width:2}</style><rect width="1024" height="1365" fill="#fff"/><text x="70" y="92" class="t h xl">TRAININGSREGELN</text><text x="74" y="142" class="t h m">FÜR IHR KRAFTTRAINING ZU HAUSE</text><rect x="45" y="175" width="934" height="220" rx="24" fill="#fbfdfb" stroke="#2f7a4e" stroke-width="2"/><circle cx="95" cy="225" r="35" fill="#2f7a4e"/><text x="84" y="239" font-family="Arial" font-size="38" font-weight="700" fill="#fff">1</text><text x="320" y="250" class="green h l">HÄUFIGKEIT</text><text x="320" y="318" class="b s">2× pro Woche trainieren</text><g transform="translate(105 260)" fill="none" stroke="#2f7a4e" stroke-width="9"><rect x="0" y="0" width="110" height="95" rx="12"/><line x1="0" y1="25" x2="110" y2="25"/><line x1="25" y1="-10" x2="25" y2="15"/><line x1="85" y1="-10" x2="85" y2="15"/><circle cx="90" cy="80" r="24" fill="#2f7a4e" stroke="none"/><path d="M78 80l8 8 16-18" stroke="#fff" stroke-width="7"/></g><rect x="45" y="412" width="934" height="245" rx="24" fill="#fcfdff" stroke="#2870ad" stroke-width="2"/><circle cx="95" cy="462" r="35" fill="#2870ad"/><text x="84" y="476" font-family="Arial" font-size="38" font-weight="700" fill="#fff">2</text><text x="320" y="486" class="blue h l">UMFANG</text><circle cx="330" cy="535" r="6" fill="#2870ad"/><text x="352" y="546" class="b s">Jede Übung: 3 Sätze</text><circle cx="330" cy="585" r="6" fill="#2870ad"/><text x="352" y="596" class="b s">6–12 Wiederholungen pro Satz</text><circle cx="330" cy="635" r="6" fill="#2870ad"/><text x="352" y="646" class="b s">Wenn Sie 12 Wiederholungen schaffen, Gewicht erhöhen</text><g transform="translate(95 515)" stroke="#2870ad" stroke-width="11"><line x1="0" y1="35" x2="115" y2="35"/><line x1="10" y1="10" x2="10" y2="60"/><line x1="26" y1="0" x2="26" y2="70"/><line x1="89" y1="0" x2="89" y2="70"/><line x1="105" y1="10" x2="105" y2="60"/></g><rect x="45" y="674" width="934" height="395" rx="24" fill="#fffdf9" stroke="#df670e" stroke-width="2"/><circle cx="95" cy="724" r="35" fill="#df670e"/><text x="84" y="738" font-family="Arial" font-size="38" font-weight="700" fill="#fff">3</text><text x="320" y="748" class="orange h l">SCHMERZREGEL</text><g transform="translate(325 800)"><line x1="0" y1="0" x2="610" y2="0" stroke="#8b9299" stroke-width="5"/><line x1="0" y1="0" x2="305" y2="0" stroke="#2f7a4e" stroke-width="7"/><circle cx="305" cy="0" r="12" fill="#df670e"/><g font-family="Arial" font-size="23" font-weight="700"><text x="-5" y="-23">0</text><text x="56" y="-23">1</text><text x="117" y="-23">2</text><text x="178" y="-23">3</text><text x="239" y="-23">4</text><text x="300" y="-23">5</text><text x="361" y="-23">6</text><text x="422" y="-23">7</text><text x="483" y="-23">8</text><text x="544" y="-23">9</text><text x="596" y="-23">10</text></g></g><circle cx="330" cy="865" r="6" fill="#df670e"/><text x="352" y="875" class="b s">Während des Trainings sind Schmerzen bis 5/10 erlaubt.</text><circle cx="330" cy="925" r="6" fill="#df670e"/><text x="352" y="935" class="b s">Am Abend und am nächsten Tag sollten die Schmerzen nicht stärker sein.</text><circle cx="330" cy="985" r="6" fill="#df670e"/><text x="352" y="992" class="b s">Wenn sie später stärker sind: nächstes Mal mit weniger Schmerz trainieren,</text><text x="352" y="1028" class="b s">zum Beispiel nur bis 4/10 oder 3/10.</text><rect x="45" y="1088" width="934" height="200" rx="24" fill="#fffafa" stroke="#b92828" stroke-width="2"/><circle cx="95" cy="1138" r="35" fill="#b92828"/><text x="84" y="1152" font-family="Arial" font-size="38" font-weight="700" fill="#fff">4</text><text x="320" y="1160" class="red h l">WICHTIG</text><text x="320" y="1218" class="b s">Schmerz bis 5/10 beim Training ist okay –</text><text x="320" y="1254" class="b s">danach sollte es nicht mehr werden.</text></svg>