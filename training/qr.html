<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR-Code · Trainingsplan</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#102b50;padding:24px}.card{width:min(520px,100%);background:#fff;border-radius:28px;padding:34px;text-align:center;box-shadow:0 18px 50px rgba(16,43,80,.12);border:1px solid #e4e7ea}.eyebrow{font-weight:900;letter-spacing:.12em;font-size:12px;color:#f36c21}h1{font-size:36px;line-height:1.05;margin:10px 0 8px}p{color:#667382;line-height:1.5}.qr{width:min(320px,82vw);height:auto;margin:22px auto 12px;display:block;image-rendering:pixelated}.url{font-weight:800;word-break:break-word;font-size:14px;color:#102b50}.print{margin-top:22px;border:0;border-radius:999px;background:#f36c21;color:#fff;padding:12px 18px;font-weight:900;cursor:pointer}@media print{body{background:#fff}.card{box-shadow:none;border:0}.print{display:none}}
</style>
</head>
<body>
<main class="card">
<div class="eyebrow">WORKING MOTION · TRAININGSPLAN</div>
<h1>Trainingsplan öffnen</h1>
<p>QR-Code mit dem Smartphone scannen.</p>
<img class="qr" src="qr-code.png" alt="QR-Code zum Trainingsplan">
<div class="url">kayus24.github.io/patienten-info-app/training/</div>
<button class="print" onclick="window.print()">QR-Code drucken</button>
</main>
</body>
</html>
